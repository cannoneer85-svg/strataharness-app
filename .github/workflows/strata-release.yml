name: Strata Atomic Desktop Release

on:
  push:
    tags:
      - 'strata-v*'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Desktop signing mode (auto falls back to unsigned when certificate secrets are absent)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - unsigned
          - signed
      targets:
        description: 'Targets to package (subset selection requires draft or prerelease to be enabled)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win-x64
          - mac-arm64
          - mac-x64
          - mac-arm64,mac-x64
          - win-x64,mac-arm64
          - win-x64,mac-x64
      draft:
        description: 'Create the GitHub Release as an unpublished draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean
      download_prod_origin:
        description: 'Optional HTTPS static feed origin override (for example https://downloads.example.com)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: strata-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24'

jobs:
  preflight:
    name: Validate release tag, product manifest, and methodology submodule
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      engine_version: ${{ steps.validate.outputs.engine_version }}
      upstream_base_tag: ${{ steps.validate.outputs.upstream_base_tag }}
      methodology_revision: ${{ steps.validate.outputs.methodology_revision }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      targets: ${{ steps.validate.outputs.targets }}
      run_windows: ${{ steps.validate.outputs.run_windows }}
      run_macos: ${{ steps.validate.outputs.run_macos }}
      macos_targets: ${{ steps.validate.outputs.macos_targets }}
      is_draft: ${{ steps.validate.outputs.is_draft }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - name: Checkout repository and methodology submodule
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.STRATA_SUBMODULE_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          set -euo pipefail
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path="$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-strata-release-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-strata-release-pnpm-
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit Soft-Fork overrides and validate release preflight
        id: validate
        env:
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          pnpm run strata:audit-overrides
          pnpm exec tsx scripts/strata/release-helper.ts preflight

  package-windows:
    name: Package Windows (win-x64)
    needs: preflight
    if: needs.preflight.outputs.run_windows == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/strata-windows-package.yml
    with:
      signing_mode: ${{ inputs.signing_mode || 'auto' }}
      build_version: ${{ needs.preflight.outputs.version }}
      download_prod_origin: ${{ inputs.download_prod_origin || '' }}
    secrets:
      STRATA_SUBMODULE_TOKEN: ${{ secrets.STRATA_SUBMODULE_TOKEN }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      DOWNLOAD_PROD_ORIGIN: ${{ secrets.DOWNLOAD_PROD_ORIGIN }}

  package-macos:
    name: Package macOS
    needs: preflight
    if: needs.preflight.outputs.run_macos == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/strata-macos-package.yml
    with:
      signing_mode: ${{ inputs.signing_mode || 'auto' }}
      targets: ${{ needs.preflight.outputs.macos_targets }}
      skip_notarization: false
      build_version: ${{ needs.preflight.outputs.version }}
      download_prod_origin: ${{ inputs.download_prod_origin || '' }}
    secrets:
      STRATA_SUBMODULE_TOKEN: ${{ secrets.STRATA_SUBMODULE_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ secrets.DSH_DESKTOP_MACOS_SIGNING_IDENTITY }}
      DSH_DESKTOP_MACOS_TEAM_ID: ${{ secrets.DSH_DESKTOP_MACOS_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DOWNLOAD_PROD_ORIGIN: ${{ secrets.DOWNLOAD_PROD_ORIGIN }}

  publish:
    name: Publish Atomic GitHub Release and Static Update Feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: strata-release-publish-${{ needs.preflight.outputs.release_tag }}
      cancel-in-progress: false
    needs:
      - preflight
      - package-windows
      - package-macos
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (
        (
          needs.preflight.outputs.is_draft != 'true' &&
          needs.preflight.outputs.is_prerelease != 'true' &&
          needs.package-windows.result == 'success' &&
          needs.package-macos.result == 'success'
        ) ||
        (
          (needs.preflight.outputs.is_draft == 'true' || needs.preflight.outputs.is_prerelease == 'true') &&
          (
            (needs.preflight.outputs.run_windows == 'true' && needs.package-windows.result == 'success') ||
            (needs.preflight.outputs.run_windows == 'false' && needs.package-windows.result == 'skipped')
          ) &&
          (
            (needs.preflight.outputs.run_macos == 'true' && needs.package-macos.result == 'success') ||
            (needs.preflight.outputs.run_macos == 'false' && needs.package-macos.result == 'skipped')
          )
        )
      )
    permissions:
      contents: write
    steps:
      - name: Checkout repository and methodology submodule
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.STRATA_SUBMODULE_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          set -euo pipefail
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path="$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-strata-release-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-strata-release-pnpm-
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download packaged target artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: strata-dist-*
          path: ${{ runner.temp }}/downloaded-artifacts
          merge-multiple: false

      - name: Collect atomic release assets, SHA256SUMS.txt, RELEASE_NOTES.md, and update-feed
        id: collect
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/downloaded-artifacts
          RELEASE_OUT_DIR: ${{ runner.temp }}/release-bundle
          RELEASE_TARGETS: ${{ needs.preflight.outputs.targets }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          IS_DRAFT: ${{ needs.preflight.outputs.is_draft }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/strata/release-helper.ts collect

      - name: Archive static update-feed workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: update-feed
          path: ${{ runner.temp }}/release-bundle/update-feed
          if-no-files-found: error
          retention-days: 30

      - name: Create or update atomic GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TARGETS: ${{ needs.preflight.outputs.targets }}
          IS_DRAFT: ${{ needs.preflight.outputs.is_draft }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          TARGET_COMMITISH: ${{ github.sha }}
          RELEASE_BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: |
          set -euo pipefail
          notes_file="$RELEASE_BUNDLE_DIR/RELEASE_NOTES.md"
          assets_dir="$RELEASE_BUNDLE_DIR/release-assets"
          checksums_file="$assets_dir/SHA256SUMS.txt"

          if [[ ! -s "$notes_file" ]]; then
            echo "Missing RELEASE_NOTES.md at $notes_file" >&2
            exit 1
          fi
          if [[ ! -s "$checksums_file" ]]; then
            echo "Missing SHA256SUMS.txt at $checksums_file" >&2
            exit 1
          fi

          shopt -s nullglob
          assets=("$assets_dir"/*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets staged in $assets_dir" >&2
            exit 1
          fi

          release_title="StrataHarness v${RELEASE_VERSION}"
          flag_args=()
          if [[ "$IS_DRAFT" == "true" ]]; then
            flag_args+=(--draft)
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            flag_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

            declare -A staged_names=()
            for asset_path in "${assets[@]}"; do
              staged_names["$(basename "$asset_path")"]=1
            done

            IFS=',' read -r -a selected_targets <<< "$RELEASE_TARGETS"
            mapfile -t existing_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for existing_name in "${existing_assets[@]}"; do
              [[ -z "$existing_name" ]] && continue
              if [[ -n "${staged_names[$existing_name]:-}" ]]; then
                continue
              fi
              should_prune="false"
              if [[ "$RELEASE_TARGETS" == "win-x64,mac-arm64,mac-x64" ]]; then
                should_prune="true"
              else
                for target_id in "${selected_targets[@]}"; do
                  if [[ "$existing_name" == *"-${target_id}."* || "$existing_name" == *"-${target_id}-"* ]]; then
                    should_prune="true"
                    break
                  fi
                done
              fi
              if [[ "$should_prune" == "true" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$existing_name" --yes
              fi
            done

            edit_args=(
              --title "$release_title"
              --notes-file "$notes_file"
              "--draft=${IS_DRAFT}"
              "--prerelease=${IS_PRERELEASE}"
            )
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$TARGET_COMMITISH" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              "${flag_args[@]}"
          fi

      - name: Sync signed static update feed to S3-compatible bucket when configured
        if: steps.collect.outputs.feed_ready == 'true'
        env:
          STRATA_S3_BUCKET: ${{ secrets.STRATA_S3_BUCKET }}
          STRATA_S3_ACCESS_KEY_ID: ${{ secrets.STRATA_S3_ACCESS_KEY_ID }}
          STRATA_S3_SECRET_ACCESS_KEY: ${{ secrets.STRATA_S3_SECRET_ACCESS_KEY }}
          STRATA_S3_ENDPOINT: ${{ secrets.STRATA_S3_ENDPOINT }}
          STRATA_S3_REGION: ${{ secrets.STRATA_S3_REGION }}
          UPDATE_FEED_ROOT: ${{ runner.temp }}/release-bundle/update-feed/strataharness
        run: |
          set -euo pipefail
          for secret_val in "${STRATA_S3_ACCESS_KEY_ID:-}" "${STRATA_S3_SECRET_ACCESS_KEY:-}"; do
            if [[ -n "$secret_val" ]]; then
              echo "::add-mask::${secret_val}"
            fi
          done

          bucket_raw="${STRATA_S3_BUCKET:-}"
          access_key="${STRATA_S3_ACCESS_KEY_ID:-}"
          secret_key="${STRATA_S3_SECRET_ACCESS_KEY:-}"

          if [[ -z "$bucket_raw" && -z "$access_key" && -z "$secret_key" ]]; then
            echo "STRATA_S3_* secrets are not configured; static feed remains archived in the update-feed workflow artifact."
            exit 0
          fi

          if [[ -z "$bucket_raw" || -z "$access_key" || -z "$secret_key" ]]; then
            echo "Incomplete S3 configuration: STRATA_S3_BUCKET, STRATA_S3_ACCESS_KEY_ID, and STRATA_S3_SECRET_ACCESS_KEY must all be provided together." >&2
            exit 1
          fi

          if [[ ! -d "$UPDATE_FEED_ROOT" ]]; then
            echo "Expected signed update-feed directory not found at $UPDATE_FEED_ROOT" >&2
            exit 1
          fi

          bucket_clean="${bucket_raw#s3://}"
          bucket_clean="${bucket_clean%/}"

          export AWS_ACCESS_KEY_ID="$access_key"
          export AWS_SECRET_ACCESS_KEY="$secret_key"
          export AWS_DEFAULT_REGION="${STRATA_S3_REGION:-auto}"

          endpoint_args=()
          if [[ -n "${STRATA_S3_ENDPOINT:-}" ]]; then
            endpoint_args+=(--endpoint-url "$STRATA_S3_ENDPOINT")
          fi

          aws s3 sync "$UPDATE_FEED_ROOT" "s3://${bucket_clean}/strataharness" \
            --exclude "*.yml" \
            "${endpoint_args[@]}"

          aws s3 sync "$UPDATE_FEED_ROOT" "s3://${bucket_clean}/strataharness" \
            --exclude "*" \
            --include "*.yml" \
            --cache-control "no-cache, must-revalidate" \
            "${endpoint_args[@]}"
