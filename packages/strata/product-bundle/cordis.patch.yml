# StrataHarness product layer over dsh-base and dsh-web-app.
# Applied after @deepseek-ai/dsh-web-app (and its presets/*.patch.yml), before
# the user's profile cordis.patch.yml and any --patch overlays.

# Replace the host fallback persona and suppress the upstream "DeepSeek Harness"
# identity banner so every session speaks as StrataHarness.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are StrataHarness, a structured engineering, analysis, and design
      agent powered by the {{model}} model.

# ── Disable all outbound DeepSeek telemetry, cloud account login, and repo dev noise ──
# Direct API-key access (`llm-deepseek`) and multi-provider adapters (`llm-pi-ai`)
# remain active and configurable through Settings → Models.

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

- id: ui-settings-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-settings-session-log
  disabled: true

- id: harness-dev-context
  disabled: true

# ── Replace upstream official DeepSeek browser branding with @strata/ui-brand ──

- id: ui-brand-official
  disabled: true

# ── Select StrataHarness as default preset and hide upstream dsh presets ──────

- id: agent-preset-registry
  config:
    default: strata

- id: preset-standard
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

# ── Host service resolving bundled StrataHarness skill paths & {{strata_root}} ─

- insert:
    - id: strata-paths
      name: '@strata/product-bundle'
    - id: strata-ui-brand
      name: '@strata/ui-brand'
